plugins {
	id 'java-library'
}

repositories {
	mavenCentral()
}

dependencies {
	// Sandboxed JavaScript engine for AI-written build scripts (bundled into the mod jar).
	api "org.mozilla:rhino:${rhino_version}"
	// Minecraft ships Gson at runtime, so the core only compiles against it.
	compileOnly "com.google.code.gson:gson:${gson_version}"

	testImplementation "com.google.code.gson:gson:${gson_version}"
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	// Java 21 so the core builds and tests on any modern JDK; the Fabric module compiles these sources for Java 25.
	options.release = 21
	options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

// Developer tool (test source set, not shipped): runs a build script or an LLM reply and renders a preview PNG.
//   ./gradlew --offline -PcoreOnly :core:preview -Pargs="path/to/build.js /tmp/out.png [seed]"
// Relative paths resolve against the repository root. Nothing depends on this task.
tasks.register('preview', JavaExec) {
	group = 'mcai'
	description = 'Renders a build script (.js) or LLM reply (.md) to a PNG preview sheet: -Pargs="in out.png [seed]"'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.saocsb.mcai.core.preview.PreviewMain'
	args providers.gradleProperty('args').map { it.trim().split(/\s+/).findAll { !it.isEmpty() } }.getOrElse([])
	workingDir = rootDir
	systemProperty 'java.awt.headless', 'true'
	maxHeapSize = '2g'
}
